```html
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alerts</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <i data-lucide="hospital"></i>
            </div>

            <div>

                <h2>
                    SecureCare
                </h2>

                <span>
                    Hospital Monitoring
                </span>

            </div>

        </div>


        <nav class="nav">

            <a href="index.html">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="monitoring.html">
                <i data-lucide="radio"></i>
                <span>Live Monitoring</span>
            </a>

            <a href="history.html">
                <i data-lucide="clipboard-list"></i>
                <span>History</span>
            </a>

            <a href="analytics.html">
                <i data-lucide="chart-column"></i>
                <span>Analytics</span>
            </a>

            <a
                href="alerts.html"
                class="active"
            >
                <i data-lucide="triangle-alert"></i>
                <span>Alerts</span>
            </a>

            <a href="settings.html">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="page-title">

                <h1>
                    Alert Center
                </h1>

                <p>
                    Detected security events
                </p>

            </div>

        </header>


        <div class="card">

            <div class="card-header">

                <h3>
                    Alert History
                </h3>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                READING
                            </th>

                            <th>
                                TIME
                            </th>

                            <th>
                                FIRE
                            </th>

                            <th>
                                SMOKE
                            </th>

                            <th>
                                VIBRATION
                            </th>

                            <th>
                                STATUS
                            </th>

                        </tr>

                    </thead>


                    <tbody id="alerts-table">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script
    type="module"
    src="js/alerts.js"
></script>


<script>
    lucide.createIcons();
</script>

</body>

</html>
