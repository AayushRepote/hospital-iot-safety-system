```html
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reading History</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                <i data-lucide="hospital"></i>
            </div>

            <div>

                <h2>
                    SecureCare
                </h2>

                <span>
                    Hospital Monitoring
                </span>

            </div>

        </div>


        <nav class="nav">

            <a href="index.html">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="monitoring.html">
                <i data-lucide="radio"></i>
                <span>Live Monitoring</span>
            </a>

            <a
                href="history.html"
                class="active"
            >
                <i data-lucide="clipboard-list"></i>
                <span>History</span>
            </a>

            <a href="analytics.html">
                <i data-lucide="chart-column"></i>
                <span>Analytics</span>
            </a>

            <a href="alerts.html">
                <i data-lucide="triangle-alert"></i>
                <span>Alerts</span>
            </a>

            <a href="settings.html">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>

        </nav>

    </aside>


    <main class="main">

        <header class="topbar">

            <div class="page-title">

                <h1>
                    Reading History
                </h1>

                <p>
                    Historical sensor and ML results
                </p>

            </div>


            <div class="system-status">

                <span class="status-dot"></span>

                DATABASE CONNECTED

            </div>

        </header>


        <div class="card">

            <div class="filters">

                <input
                    type="text"
                    id="search"
                    placeholder="Search reading ID..."
                >


                <select id="status-filter">

                    <option value="ALL">
                        All Status
                    </option>

                    <option value="NORMAL">
                        Normal
                    </option>

                    <option value="ALERT">
                        Alerts
                    </option>

                </select>


                <button
                    class="btn btn-secondary"
                    id="refresh"
                >

                    <i data-lucide="refresh-cw"></i>

                    Refresh

                </button>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                TIME
                            </th>

                            <th>
                                TEMP
                            </th>

                            <th>
                                SMOKE
                            </th>

                            <th>
                                FIRE
                            </th>

                            <th>
                                VIBRATION
                            </th>

                            <th>
                                STATUS
                            </th>

                        </tr>

                    </thead>


                    <tbody id="history-table">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script
    type="module"
    src="js/history.js"
></script>


<script>
    lucide.createIcons();
</script>

</body>

</html>
```
